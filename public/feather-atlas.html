<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Feather Atlas — Interactive 3D Bird Field Guide</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <style>
    /* === COLOR TOKENS === */
    :root {
      --bg: #f6f1e7;
      --panel: #fbf8f1;
      --line: #e7e0d1;
      --ink: #1b1a17;
      --muted: #6d685d;
      --sage: #4d5a3d;
      --sage-ink: #ffffff;
      --sage-tint: #e9ebdc;
      --chip: #efeadd;
      --shadow: 60,48,28;
      --ease: cubic-bezier(.22,.8,.24,1);
      --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
      --font-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
    }

    .hero[data-light="dusk"] {
      --bg: #14170f;
      --panel: #1b1f15;
      --line: #2d3324;
      --ink: #f2ecdf;
      --muted: #a8a392;
      --sage: #a9b98a;
      --sage-ink: #14170f;
      --sage-tint: #283020;
      --chip: #262b1d;
      --shadow: 0,0,0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      transition: background 0.6s var(--ease), color 0.6s var(--ease);
      user-select: none;
    }

    button, input {
      font-family: inherit;
      color: inherit;
      border: none;
      background: none;
      outline: none;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible, div:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--sage);
      outline-offset: 2px;
    }

    /* === SVG ICONS === */
    .icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* === HERO CONTAINER === */
    .hero {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: grid;
      grid-template-columns: 196px minmax(0, 1fr) clamp(300px, 27vw, 356px);
      background: var(--bg);
      color: var(--ink);
      transition: background 0.6s var(--ease), color 0.6s var(--ease);
    }

    /* 3D WebGL Canvas over entire hero */
    #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    .mobile-top-bar {
      display: none;
    }

    /* === 1) LEFT SIDEBAR === */
    aside.sidebar {
      position: relative;
      z-index: 6;
      display: flex;
      flex-direction: column;
      padding: 22px 12px 18px 24px;
      border-right: 1px solid var(--line);
      background: var(--bg);
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease), background 0.6s var(--ease), border-color 0.6s var(--ease);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.1;
    }

    .nav-list {
      margin: 20px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .nav-list::-webkit-scrollbar { display: none; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      text-align: left;
      color: var(--ink);
      transition: background 0.2s var(--ease);
    }

    .nav-item:hover {
      background: var(--chip);
    }

    .nav-item[aria-current="page"] {
      background: var(--sage-tint);
    }

    .nav-item-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .nav-item-text small {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Featured Card Pinned Bottom */
    .featured-card {
      margin-top: auto;
      background: var(--sage-tint);
      border-radius: 10px;
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background 0.6s var(--ease);
    }

    .featured-eyebrow {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .featured-img-wrap {
      width: 100%;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }

    .featured-img {
      max-width: 92px;
      max-height: 76px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
      transition: opacity 0.3s var(--ease);
    }

    .featured-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.2;
    }

    .featured-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .featured-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
      margin-top: 4px;
      cursor: pointer;
    }
    .featured-link .icon {
      width: 14px;
      height: 14px;
    }

    /* === 2) CENTRE COLUMN === */
    section.main {
      position: relative;
      z-index: 6;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 48px 18px 14px 26px;
      height: 100%;
      pointer-events: none; /* Let canvas / stage receive pointers */
    }

    /* Tabs Row */
    .tabs-row {
      display: flex;
      gap: 10px;
      pointer-events: auto;
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
    }

    .tab-button {
      width: 130px;
      padding: 8px 8px 11px;
      display: grid;
      justify-items: center;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: transform 0.2s var(--ease), background 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .tab-button:hover {
      transform: translateY(-2px);
    }

    .tab-button[aria-selected="true"] {
      background: var(--sage-tint);
      border-color: color-mix(in srgb, var(--sage) 45%, transparent);
    }

    .tab-img {
      width: 58px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
    }

    .tab-name {
      font-family: var(--font-display);
      font-size: 15.5px;
      font-weight: 500;
      color: var(--ink);
      margin-top: 4px;
      line-height: 1.1;
    }

    .tab-latin {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Interactive Stage */
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      user-select: none;
      pointer-events: auto;
    }
    #stage.grabbing {
      cursor: grabbing;
    }

    /* Ground Shadow */
    .ground-shadow {
      position: absolute;
      left: 50%;
      bottom: 15%;
      transform: translateX(-50%);
      width: min(62%, 460px);
      height: 44px;
      background: radial-gradient(closest-side, rgba(var(--shadow), 0.22), transparent);
      pointer-events: none;
      transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
      border-radius: 50%;
    }
    .ground-shadow.switching {
      opacity: 0;
      transform: translateX(-50%) scaleX(0.4);
    }

    /* Loader */
    .stage-loader {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s var(--ease);
      z-index: 8;
    }
    .stage-loader.visible {
      opacity: 1;
    }

    .loader-ring {
      width: 30px;
      height: 30px;
      border: 1.5px solid var(--line);
      border-top-color: var(--sage);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* Fallback image */
    .stage-fallback {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 320px;
      max-height: 320px;
      object-fit: contain;
      display: none;
      pointer-events: none;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.18));
    }
    .stage-fallback.visible {
      display: block;
    }

    /* Interaction Hint */
    .stage-hint {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s var(--ease);
    }
    .stage-hint.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Icon Rail (Left Center) */
    .icon-rail {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      gap: 9px;
      z-index: 6;
      pointer-events: auto;
    }

    .rail-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: transform 0.15s var(--ease), border-color 0.2s var(--ease), background 0.2s var(--ease), color 0.2s var(--ease);
    }

    .rail-btn:hover {
      border-color: var(--sage);
    }
    .rail-btn:active {
      transform: scale(0.92);
    }
    .rail-btn.on {
      background: var(--sage);
      color: var(--sage-ink);
      border-color: var(--sage);
    }
    .rail-btn .icon {
      width: 17px;
      height: 17px;
    }

    /* Turn Pill (Bottom Center) */
    .turn-pill {
      position: absolute;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      gap: 2px;
      z-index: 6;
      font-size: 13px;
      color: var(--ink);
      pointer-events: auto;
      transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .turn-btn {
      padding: 4px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s var(--ease);
    }
    .turn-btn:hover {
      background: var(--chip);
    }
    .turn-btn .icon {
      width: 14px;
      height: 14px;
    }

    /* Stage Caption */
    .stage-caption {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(16px, 1.55vw, 20px);
      color: var(--ink);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.3s var(--ease);
    }

    /* === 3) RIGHT COLUMN === */
    section.info {
      position: relative;
      z-index: 6;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      padding: 13px 26px 14px 0;
      height: 100%;
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
    }

    .info-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      flex: 1;
      height: 32px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      transition: border-color 0.2s var(--ease), background 0.3s var(--ease);
    }
    .search-box:focus-within {
      border-color: var(--sage);
    }
    .search-box .icon {
      width: 15px;
      height: 15px;
      color: var(--muted);
    }
    .search-input {
      width: 100%;
      font-size: 11.5px;
      color: var(--ink);
    }
    .search-input::placeholder {
      color: var(--muted);
    }

    .top-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: border-color 0.2s var(--ease), background 0.3s var(--ease);
    }
    .top-btn:hover {
      border-color: var(--sage);
    }
    .top-btn .icon {
      width: 16px;
      height: 16px;
    }

    .account-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .account-circle .icon {
      width: 14px;
      height: 14px;
      stroke: var(--panel);
    }

    /* Detail Card */
    .detail-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 22px 20px 16px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      display: flex;
      flex-direction: column;
      transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
    }
    .detail-card::-webkit-scrollbar {
      width: 4px;
    }
    .detail-card::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 4px;
    }

    .detail-article {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .anim-child {
      transition: transform 0.6s var(--ease), opacity 0.6s var(--ease);
    }

    .detail-eyebrow {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .detail-title {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(40px, 4.2vw, 54px);
      line-height: 1;
      letter-spacing: -0.025em;
      margin-top: 8px;
      color: var(--ink);
    }

    .tag-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .tag-pill {
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--ink);
      line-height: 1;
      transition: background 0.3s var(--ease);
    }

    .detail-desc {
      font-size: 13.5px;
      line-height: 1.55;
      text-wrap: pretty;
      color: var(--ink);
      margin-top: 16px;
    }

    .section-h2 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 21px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 20px;
      color: var(--ink);
      line-height: 1.2;
    }

    .traits-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .trait-row {
      display: grid;
      grid-template-columns: 22px 88px 1fr;
      gap: 16px;
      align-items: center;
      font-size: 13px;
    }
    .trait-row .icon {
      width: 16px;
      height: 16px;
      color: var(--sage);
    }
    .trait-label {
      color: var(--muted);
    }
    .trait-val {
      font-weight: 600;
      color: var(--ink);
    }

    .habitat-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--ink);
      line-height: 1.4;
    }
    .habitat-row .icon {
      width: 18px;
      height: 18px;
      color: var(--sage);
      flex-shrink: 0;
    }

    /* Close-up Detail Button Pinned Bottom */
    .closeup-btn {
      margin-top: auto;
      padding-top: 16px;
      display: grid;
      grid-template-columns: 76px 1fr 18px;
      gap: 14px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: left;
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease);
      margin-top: 24px;
    }
    .closeup-btn:hover {
      border-color: var(--sage);
      background: var(--sage-tint);
    }
    .closeup-btn[aria-pressed="true"] {
      border-color: var(--sage);
      background: var(--sage-tint);
    }
    .closeup-btn[aria-pressed="true"] .closeup-chevron {
      transform: rotate(180deg);
    }

    .closeup-lens {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      background-size: 520%;
      background-repeat: no-repeat;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.14);
      flex-shrink: 0;
      transition: background-position 0.3s var(--ease);
    }

    .closeup-texts {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .closeup-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.2;
    }
    .closeup-desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
    }

    .closeup-chevron {
      transition: transform 0.3s var(--ease);
      color: var(--ink);
    }
    .closeup-chevron .icon {
      width: 16px;
      height: 16px;
    }

    /* === FOCUS MODE === */
    .hero.focus aside.sidebar {
      transform: translateX(-24px);
      opacity: 0;
      pointer-events: none;
    }
    .hero.focus section.info {
      transform: translateX(24px);
      opacity: 0;
      pointer-events: none;
    }
    .hero.focus .tabs-row {
      transform: translateY(-16px);
      opacity: 0;
      pointer-events: none;
    }

    /* === RESPONSIVE: TABLET (<=1100px) === */
    @media (max-width: 1100px) {
      .hero {
        grid-template-columns: minmax(0, 1fr) clamp(280px, 36vw, 340px);
      }
      aside.sidebar {
        display: none !important;
      }
      section.main {
        padding-left: 20px;
      }
    }

    /* === RESPONSIVE: PHONE (<=760px) === */
    @media (max-width: 760px) {
      .hero {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      /* Mobile Top Bar */
      .mobile-top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px 0;
        z-index: 8;
        pointer-events: auto;
        transition: opacity 0.4s var(--ease);
      }
      .mobile-brand {
        font-family: var(--font-display);
        font-size: 21px;
        font-weight: 500;
        color: var(--ink);
      }
      .mobile-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      section.main {
        flex: 1;
        padding: 10px 14px 6px;
        grid-template-rows: auto 1fr;
      }

      .tabs-row {
        width: 100%;
      }
      .tab-button {
        flex: 1;
        width: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        text-align: left;
      }
      .tab-img {
        width: 44px;
        height: 40px;
      }
      .tab-texts {
        display: flex;
        flex-direction: column;
      }
      .tab-name {
        font-size: 15px;
        margin-top: 0;
      }
      .tab-latin {
        font-size: 12px;
      }

      .rail-btn {
        width: 34px;
        height: 34px;
      }
      .icon-rail {
        gap: 7px;
      }

      .turn-pill {
        bottom: 30px;
      }

      .stage-caption {
        font-size: 15px;
      }

      .stage-hint {
        display: none !important;
      }

      .ground-shadow {
        bottom: 17%;
        height: 30px;
      }

      /* Detail Card as Bottom Sheet */
      section.info {
        position: absolute;
        bottom: 0;

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /* === ASSET DEFINITIONS === */
    const CDN = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/';

    const BIRDS = [
      {
        id: 'hoopoe',
        name: 'Hoopoe',
        latin: 'Upupa epops',
        family: 'UPUPIDAE',
        tags: ['Ground forager', 'Crested', 'Migrant'],
        desc: 'Unmistakable in cinnamon, black and white, the hoopoe walks open ground probing for grubs with its long curved bill. It lifts its crest into a fan when it lands or takes fright, and flies on broad wings with a loose, butterfly-like beat.',
        traits: [
          { icon: 'icon-ruler', label: 'Length', val: '25–29 cm' },
          { icon: 'icon-wing', label: 'Wingspan', val: '44–48 cm' },
          { icon: 'icon-fish', label: 'Diet', val: 'Insects, larvae and grubs' },
          { icon: 'icon-globe', label: 'Range', val: 'Europe, Asia and Africa' }
        ],
        habitat: 'Orchards, vineyards and dry grassland.',
        caption: 'A crown raised, and the orchard takes notice.',
        closeupText: 'Every crest feather ends in a black tip, so the raised fan reads like a row of signal flags.',
        lensPos: '62% 22%',
        featured: {
          title: 'A crown of cinnamon.',
          text: 'Bold bars on broad wings. A call you hear before you see it.'
        },
        png: `${CDN}hf_20261004_073256_21ed095c-d038-4ab5-87b7-b44e527ec449.png`,
        glb: `${CDN}hf_20261004_073347_06b339a7-70bc-4ecd-9e72-1a4143264da9.glb`
      },
      {
        id: 'kingfisher',
        name: 'Kingfisher',
        latin: 'Alcedo atthis',
        family: 'ALCEDINIDAE',
        tags: ['River bird', 'Diver', 'Iridescent'],
        desc: 'A small, spectacular bird of rivers and lakes, the kingfisher is renowned for its dazzling plumage and astonishing hunting dives. A master of stealth and speed, it links healthy waterways with extraordinary beauty.',
        traits: [
          { icon: 'icon-ruler', label: 'Length', val: '16–17 cm' },
          { icon: 'icon-gauge', label: 'Dive speed', val: 'Up to 40 km/h' },
          { icon: 'icon-fish', label: 'Diet', val: 'Small fish and insects' },
          { icon: 'icon-globe', label: 'Range', val: 'Europe and Asia' }
        ],
        habitat: 'Slow rivers, streams and lakes.',
        caption: 'Blink, and the river keeps its secret.',
        closeupText: 'An intricate mosaic of structure and colour gives the kingfisher its unmistakable sheen.',
        lensPos: '24% 30%',
        featured: {
          title: 'A flash of river blue.',
          text: 'Extraordinary colours. A remarkable life by the water.'
        },
        png: `${CDN}hf_20261004_073256_f9e3e60d-acdc-4925-b393-c4ce14b28711.png`,
        glb: `${CDN}hf_20261004_073345_12721630-c589-442f-8884-e4a445cd8980.glb`
      }
    ];

    let activeIndex = 1; // Kingfisher selected by default

    /* === DOM ELEMENTS === */
    const heroEl = document.getElementById('featherHero');
    const canvas = document.getElementById('gl');
    const stage = document.getElementById('stage');
    const groundShadow = document.getElementById('groundShadow');
    const stageLoader = document.getElementById('stageLoader');
    const stageFallback = document.getElementById('stageFallback');
    const stageHint = document.getElementById('stageHint');
    const stageCaption = document.getElementById('stageCaption');
    const tabs = [document.getElementById('tab-0'), document.getElementById('tab-1')];

    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnExpand = document.getElementById('btnExpand');
    const btnLight = document.getElementById('btnLight');
    const btnCloseUp = document.getElementById('btnCloseUp');

    const btnTurnLeft = document.getElementById('btnTurnLeft');
    const btnTurn360 = document.getElementById('btnTurn360');
    const btnTurnRight = document.getElementById('btnTurnRight');

    const featuredImg = document.getElementById('featuredImg');
    const featuredTitle = document.getElementById('featuredTitle');
    const featuredText = document.getElementById('featuredText');

    const detailArticle = document.getElementById('detailArticle');
    const detailFamily = document.getElementById('detailFamily');
    const detailName = document.getElementById('detailName');
    const detailTags = document.getElementById('detailTags');
    const detailDesc = document.getElementById('detailDesc');
    const detailTraits = document.getElementById('detailTraits');
    const detailHabitat = document.getElementById('detailHabitat');
    const closeupLens = document.getElementById('closeupLens');
    const closeupText = document.getElementById('closeupText');

    /* === THREE.JS INITIALIZATION === */
    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const roomEnv = new RoomEnvironment();
    scene.environment = pmremGenerator.fromScene(roomEnv, 0.04).texture;
    scene.environmentIntensity = 0.95;

    const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
    camera.position.set(0, 0, 8);
    camera.lookAt(0, 0, 0);

    const keyLight = new THREE.DirectionalLight(0xfff4e2, 1.6);
    keyLight.position.set(2.5, 4, 5);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xbfd8ff, 0.5);
    rimLight.position.set(-4, 2, -3);
    scene.add(rimLight);

    /* === GLTF / DRACO LOADERS === */
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    /* === SPECIMEN RIGS === */
    const homeEuler = new THREE.Euler(0.12, 0.75, 0, 'YXZ');
    const homeQuat = new THREE.Quaternion().setFromEuler(homeEuler);

    const rigs = BIRDS.map((bird, i) => {
      const pivotGroup = new THREE.Group();
      const spinGroup = new THREE.Group();
      const holderGroup = new THREE.Group();

      spinGroup.quaternion.copy(homeQuat);

      pivotGroup.add(spinGroup);
      spinGroup.add(holderGroup);
      scene.add(pivotGroup);

      // Initially only active bird is visible
      pivotGroup.visible = (i === activeIndex);

      return {
        bird,
        pivotGroup,
        spinGroup,
        holderGroup,
        model: null,
        loaded: false,
        failed: false,
        angularVelocity: new THREE.Vector2(0, 0)
      };
    });

    function loadBird(index, onComplete) {
      const rig = rigs[index];
      if (rig.loaded || rig.loading) {
        if (onComplete) onComplete(rig);
        return;
      }

      rig.loading = true;
      if (index === activeIndex) {
        stageLoader.classList.add('visible');
      }

      gltfLoader.load(
        rig.bird.glb,
        (gltf) => {
          const model = gltf.scene;
          rig.model = model;

          // Compute bounding sphere and re-center
          const box = new THREE.Box3().setFromObject(model);
          const sphere = new THREE.Sphere();
          box.getBoundingSphere(sphere);

          model.position.sub(sphere.center);

          // Scale holder so radius is 1
          const scale = 1 / (sphere.radius || 1);
          rig.holderGroup.scale.set(scale, scale, scale);

          const maxAniso = renderer.capabilities.getMaxAnisotropy();
          model.traverse((child) => {
            if (child.isMesh) {
              child.frustumCulled = false;
              if (child.material) {
                if (child.material.map) {
                  child.material.map.anisotropy = maxAniso;
                }
              }
            }
          });

          rig.holderGroup.add(model);
          rig.loaded = true;
          rig.loading = false;

          if (index === activeIndex) {
            stageLoader.classList.remove('visible');
            stageFallback.classList.remove('visible');
          }

          if (onComplete) onComplete(rig);
        },
        undefined,
        (err) => {
          console.warn('Failed to load GLB for', rig.bird.name, err);
          rig.failed = true;
          rig.loading = false;
          if (index === activeIndex) {
            stageLoader.classList.remove('visible');
            stageFallback.src = rig.bird.png;
            stageFallback.classList.add('visible');
          }
          if (onComplete) onComplete(rig);
        }
      );
    }

    // Load active bird first, then background preload
    loadBird(activeIndex, () => {
      const otherIndex = activeIndex === 0 ? 1 : 0;
      loadBird(otherIndex);
    });

    /* === FRAMING & RESIZE OBSERVER === */
    let heroW = window.innerWidth;
    let heroH = window.innerHeight;
    let stageRect = { left: 0, top: 0, width: heroW, height: heroH };

    let targetCx = heroW / 2;
    let targetCy = heroH / 2;
    let targetPx = 200;

    let curCx = targetCx;
    let curCy = targetCy;
    let curPx = targetPx;

    let targetZoom = 1.0;
    let curZoom = 1.0;

    let isFocusMode = false;

    function updateFramingBounds() {
      const rect = heroEl.getBoundingClientRect();
      heroW = rect.width;
      heroH = rect.height;

      const sRect = stage.getBoundingClientRect();
      stageRect = {
        left: sRect.left - rect.left,
        top: sRect.top - rect.top,
        width: sRect.width,
        height: sRect.height
      };

      if (isFocusMode) {
        targetCx = heroW / 2;
        targetCy = heroH / 2;
        targetPx = Math.min(heroW, heroH) * 0.42;
      } else {
        targetCx = stageRect.left + stageRect.width * 0.5;
        targetCy = stageRect.top + stageRect.height * 0.44;
        targetPx = Math.min(stageRect.width * 0.5, stageRect.height * 0.6) * 1.16;
      }

      renderer.setSize(heroW, heroH, false);
    }

    const resizeObserver = new ResizeObserver(() => {
      updateFramingBounds();
    });
    resizeObserver.observe(heroEl);
    resizeObserver.observe(stage);

    /* === INTERACTION CONTROLS === */
    let isDragging = false;
    let prevPointerX = 0;
    let prevPointerY = 0;
    let lastDragTime = 0;
    let hasInteracted = false;
    let lastInteractionTime = performance.now();

    function markInteraction() {
      if (!hasInteracted) {
        hasInteracted = true;
        stageHint.classList.add('hidden');
      }
      lastInteractionTime = performance.now();
    }

    // Pointer events on Stage
    stage.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      prevPointerX = e.clientX;
      prevPointerY = e.clientY;
      lastDragTime = performance.now();
      stage.classList.add('grabbing');
      stage.setPointerCapture(e.pointerId);
      markInteraction();

      const activeRig = rigs[activeIndex];
      activeRig.angularVelocity.set(0, 0);
    });

    stage.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      markInteraction();

      const now = performance.now();
      const dt = Math.max(0.001, (now - lastDragTime) * 0.001);
      lastDragTime = now;

      const dx = e.clientX - prevPointerX;
      const dy = e.clientY - prevPointerY;
      prevPointerX = e.clientX;
      prevPointerY = e.clientY;

      const k = Math.PI / Math.max(260, curPx * 1.6);
      const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx * k);
      const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy * k);

      const activeRig = rigs[activeIndex];
      activeRig.spinGroup.quaternion.premultiply(qY).premultiply(qX);

      // Record velocity
      activeRig.angularVelocity.set(dx * k / dt, dy * k / dt);
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      stage.classList.remove('grabbing');
      try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    // Mouse Wheel Zoom
    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      markInteraction();
      const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016));
      targetZoom = THREE.MathUtils.clamp(targetZoom * factor, 0.55, 3.4);
      updateZoomButtons();
    }, { passive: false });

    // Touch pinch zoom
    let activeTouchCount = 0;
    let initialPinchDist = 0;
    let pinchStartZoom = 1;

    stage.addEventListener('touchstart', (e) => {
      activeTouchCount = e.touches.length;
      if (activeTouchCount === 2) {
        markInteraction();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        pinchStartZoom = targetZoom;
      }
    }, { passive: true });

    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist > 0) {
        markInteraction();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const ratio = dist / initialPinchDist;
        targetZoom = THREE.MathUtils.clamp(pinchStartZoom * ratio, 0.55, 3.4);
        updateZoomButtons();
      }
    }, { passive: true });

    // Double-click / Key 0 Reset
    function resetView() {
      markInteraction();
      targetZoom = 1.0;
      updateZoomButtons();
      isResettingQuat = true;
    }

    let isResettingQuat = false;
    stage.addEventListener('dblclick', resetView);

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === stage || document.activeElement === document.body) {
        if (e.key === '0') {
          resetView();
        } else if (e.key === 'ArrowLeft') {
          rotateBy(0, 0.18);
        } else if (e.key === 'ArrowRight') {
          rotateBy(0, -0.18);
        } else if (e.key === 'ArrowUp') {
          rotateBy(0.18, 0);
        } else if (e.key === 'ArrowDown') {
          rotateBy(-0.18, 0);
        } else if (e.key === '+' || e.key === '=') {
          targetZoom = THREE.MathUtils.clamp(targetZoom * 1.2, 0.55, 3.4);
          updateZoomButtons();
          markInteraction();
        } else if (e.key === '-' || e.key === '_') {
          targetZoom = THREE.MathUtils.clamp(targetZoom / 1.2, 0.55, 3.4);
          updateZoomButtons();
          markInteraction();
        } else if (e.key === 'Escape' && isFocusMode) {
          toggleFocusMode();
        }
      }
    });

    function rotateBy(pitch, yaw) {
      markInteraction();
      const activeRig = rigs[activeIndex];
      const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
      activeRig.spinGroup.quaternion.premultiply(qY).premultiply(qX);
      activeRig.angularVelocity.set(0, 0);
    }

    // Turn pill queue
    let turnQueue = 0;
    function queueYaw(angleRad) {
      markInteraction();
      turnQueue += angleRad;
    }

    btnTurnLeft.addEventListener('click', () => queueYaw(-Math.PI * 0.5));
    btnTurnRight.addEventListener('click', () => queueYaw(Math.PI * 0.5));
    btnTurn360.addEventListener('click', () => queueYaw(Math.PI * 2));

    // Zoom Buttons
    function updateZoomButtons() {
      btnZoomIn.classList.toggle('on', targetZoom >= 1.0);
      btnZoomIn.setAttribute('aria-pressed', targetZoom >= 1.0 ? 'true' : 'false');

      btnZoomOut.classList.toggle('on', targetZoom < 1.0);
      btnZoomOut.setAttribute('aria-pressed', targetZoom < 1.0 ? 'true' : 'false');

      btnCloseUp.setAttribute('aria-pressed', targetZoom > 2.2 ? 'true' : 'false');
    }

    btnZoomIn.addEventListener('click', () => {
      markInteraction();
      targetZoom = THREE.MathUtils.clamp(targetZoom * 1.35, 0.55, 3.4);
      updateZoomButtons();
    });

    btnZoomOut.addEventListener('click', () => {
      markInteraction();
      targetZoom = THREE.MathUtils.clamp(targetZoom / 1.35, 0.55, 3.4);
      updateZoomButtons();
    });

    // Close-up Detail Toggle
    btnCloseUp.addEventListener('click', () => {
      markInteraction();
      if (targetZoom > 2.2) {
        targetZoom = 1.0;
      } else {
        targetZoom = 2.6;
      }
      updateZoomButtons();
    });

    // Expand Focus Mode
    function toggleFocusMode() {
      markInteraction();
      isFocusMode = !isFocusMode;
      heroEl.classList.toggle('focus', isFocusMode);
      btnExpand.classList.toggle('on', isFocusMode);
      btnExpand.setAttribute('aria-pressed', isFocusMode ? 'true' : 'false');
      updateFramingBounds();
    }
    btnExpand.addEventListener('click', toggleFocusMode);

    // Light Button (Day / Dusk)
    let isDusk = false;
    let targetEnvIntensity = 0.95;
    let targetKeyIntensity = 1.6;
    let targetKeyColor = new THREE.Color(0xfff4e2);
    let targetRimIntensity = 0.5;
    let targetExposure = 1.05;

    btnLight.addEventListener('click', () => {
      markInteraction();
      isDusk = !isDusk;
      heroEl.setAttribute('data-light', isDusk ? 'dusk' : 'day');
      btnLight.classList.toggle('on', isDusk);
      btnLight.setAttribute('aria-pressed', isDusk ? 'true' : 'false');

      if (isDusk) {
        targetEnvIntensity = 0.28;
        targetKeyIntensity = 2.6;
        targetKeyColor.set('#ffc98a');
        targetRimIntensity = 1.9;
        targetExposure = 1.0;
      } else {
        targetEnvIntensity = 0.95;
        targetKeyIntensity = 1.6;
        targetKeyColor.set('#fff4e2');
        targetRimIntensity = 0.5;
        targetExposure = 1.05;
      }
    });

    /* === TAB SWITCHING & CONTENT SWAP === */
    let isSwitchingTab = false;
    let switchStartTime = 0;
    const SWITCH_DURATION = 780; // ms
    let switchOldIndex = 0;
    let switchNewIndex = 1;

    function outBack(t) {
      return 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
    }

    function selectTab(newIndex) {
      if (newIndex === activeIndex || isSwitchingTab) return;
      markInteraction();

      switchOldIndex = activeIndex;
      switchNewIndex = newIndex;
      activeIndex = newIndex;

      isSwitchingTab = true;
      switchStartTime = performance.now();

      // Update tabs UI
      tabs.forEach((t, i) => {
        t.setAttribute('aria-selected', i === newIndex ? 'true' : 'false');
        t.tabIndex = (i === newIndex ? 0 : -1);
      });

      // Show shadow squish
      groundShadow.classList.add('switching');
      setTimeout(() => {
        groundShadow.classList.remove('switching');
      }, SWITCH_DURATION);

      // Make incoming bird visible and reset
      const inRig = rigs[newIndex];
      inRig.pivotGroup.visible = true;
      inRig.spinGroup.quaternion.copy(homeQuat);
      inRig.angularVelocity.set(0, 0);

      // Check if incoming is ready
      if (!inRig.loaded && !inRig.failed) {
        stageLoader.classList.add('visible');
        loadBird(newIndex, () => {
          stageLoader.classList.remove('visible');
        });
      } else if (inRig.failed) {
        stageFallback.src = inRig.bird.png;
        stageFallback.classList.add('visible');
      } else {
        stageLoader.classList.remove('visible');
        stageFallback.classList.remove('visible');
      }

      // Reset zoom to 1
      targetZoom = 1.0;
      updateZoomButtons();

      // Animate side content
      swapSideContent(BIRDS[newIndex]);
    }

    tabs.forEach((btn, idx) => {
      btn.addEventListener('click', () => selectTab(idx));
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          selectTab((idx - 1 + BIRDS.length) % BIRDS.length);
          tabs[(idx - 1 + BIRDS.length) % BIRDS.length].focus();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          selectTab((idx + 1) % BIRDS.length);
          tabs[(idx + 1) % BIRDS.length].focus();
        }
      });
    });

    function swapSideContent(bird) {
      const children = detailArticle.querySelectorAll('.anim-child');
      
      // Step 1: animate out
      children.forEach((c) => {
        c.style.opacity = '0';
        c.style.transform = 'translateY(-6px)';
        c.style.transition = 'opacity 0.2s ease-in, transform 0.2s ease-in';
      });

      setTimeout(() => {
        // Step 2: replace text & images
        renderBirdData(bird);

        // Step 3: animate in staggered
        children.forEach((c, idx) => {
          c.style.transform = 'translateY(12px)';
          c.style.opacity = '0';
          setTimeout(() => {
            c.style.transition = 'opacity 0.6s var(--ease), transform 0.6s var(--ease)';
            c.style.transform = 'translateY(0)';
            c.style.opacity = '1';
          }, idx * 45);
        });
      }, 200);
    }

    function renderBirdData(bird) {
      detailFamily.textContent = bird.family;
      detailName.textContent = bird.name;
      detailTags.innerHTML = bird.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');
      detailDesc.textContent = bird.desc;

      detailTraits.innerHTML = bird.traits.map(tr => `
        <div class="trait-row">
          <svg class="icon"><use href="#${tr.icon}"/></svg>
          <span class="trait-label">${tr.label}</span>
          <span class="trait-val">${tr.val}</span>
        </div>
      `).join('');

      detailHabitat.textContent = bird.habitat;
      stageCaption.textContent = bird.caption;

      closeupLens.style.backgroundImage = `url("${bird.png}")`;
      closeupLens.style.backgroundPosition = bird.lensPos;
      closeupText.textContent = bird.closeupText;

      featuredImg.src = bird.png;
      featuredImg.alt = bird.name;
      featuredTitle.textContent = bird.featured.title;
      featuredText.textContent = bird.featured.text;
    }

    // Initial populate
    renderBirdData(BIRDS[activeIndex]);

    /* === ANIMATION / RENDER TICK === */
    let prevClockTime = performance.now();

    function animate(time) {
      requestAnimationFrame(animate);

      const dt = Math.min(0.1, (time - prevClockTime) * 0.001);
      prevClockTime = time;
      const tSec = time * 0.001;

      // Consuming turn queue
      if (Math.abs(turnQueue) > 0.0001) {
        const step = turnQueue * (1 - Math.exp(-dt * 4.2));
        turnQueue -= step;
        const qTurn = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), step);
        rigs[activeIndex].spinGroup.quaternion.premultiply(qTurn);
      }

      // Reset orientation slerp
      if (isResettingQuat) {
        rigs[activeIndex].spinGroup.quaternion.slerp(homeQuat, 1 - Math.exp(-dt * 6));
        if (rigs[activeIndex].spinGroup.quaternion.angleTo(homeQuat) < 0.001) {
          rigs[activeIndex].spinGroup.quaternion.copy(homeQuat);
          isResettingQuat = false;
        }
      }

      // Inertia on active bird spin
      const activeRig = rigs[activeIndex];
      if (!isDragging && activeRig.angularVelocity.lengthSq() > 0.000001) {
        const vel = activeRig.angularVelocity;
        const decay = Math.exp(-dt * 4.5);
        const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), vel.x * dt);
        const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), vel.y * dt);
        activeRig.spinGroup.quaternion.premultiply(qY).premultiply(qX);
        vel.multiplyScalar(decay);
      }

      // Idle life (after 1.8s without interaction)
      const inactiveSec = (time - lastInteractionTime) * 0.001;
      const idleWeight = THREE.MathUtils.clamp((inactiveSec - 1.8) / 1.5, 0, 1);

      rigs.forEach((rig, idx) => {
        // constant hover
        rig.pivotGroup.position.y = Math.sin(tSec * 1.3 + idx) * 0.028;

        if (idleWeight > 0) {
          rig.pivotGroup.rotation.y = Math.sin(tSec * 0.55) * 0.16 * idleWeight;
          rig.pivotGroup.rotation.x = Math.sin(tSec * 0.9) * 0.03 * idleWeight;
        } else {
          rig.pivotGroup.rotation.set(0, 0, 0);
        }
      });

      // Tab Switch transition
      if (isSwitchingTab) {
        const elapsed = time - switchStartTime;
        const progress = Math.min(1, elapsed / SWITCH_DURATION);
        const dir = Math.sign(switchNewIndex - switchOldIndex);
        const slide = (stageRect.width * 0.95) / curPx;

        const outRig = rigs[switchOldIndex];
        const inRig = rigs[switchNewIndex];

        // Outgoing over 60% of duration
        const outProgress = Math.min(1, progress / 0.6);
        const outE = outProgress * outProgress * outProgress; // ease-in cubic
        outRig.pivotGroup.scale.setScalar(Math.max(0, 1 - outE));
        outRig.pivotGroup.position.x = -dir * outE * slide;
        outRig.pivotGroup.rotation.y = -dir * outE * 1.4;

        if (outProgress >= 1) {
          outRig.pivotGroup.visible = false;
        }

        // Incoming over full duration
        const inE = 1 - Math.pow(1 - progress, 3); // ease-out cubic
        const inBack = outBack(progress);
        const inScale = Math.max(0, inBack * (0.25 + 0.75 * inE));
        inRig.pivotGroup.scale.setScalar(inScale);
        inRig.pivotGroup.position.x = dir * (1 - inE) * slide;
        inRig.pivotGroup.rotation.y = dir * (1 - inE) * 1.6;

        if (progress >= 1) {
          isSwitchingTab = false;
          outRig.pivotGroup.visible = false;
          inRig.pivotGroup.scale.setScalar(1);
          inRig.pivotGroup.position.set(0, 0, 0);
          inRig.pivotGroup.rotation.set(0, 0, 0);
        }
      }

      // Ease framing (cx, cy, px, zoom)
      curCx += (targetCx - curCx) * (1 - Math.exp(-dt * 7));
      curCy += (targetCy - curCy) * (1 - Math.exp(-dt * 7));
      curPx += (targetPx - curPx) * (1 - Math.exp(-dt * 7));
      curZoom += (targetZoom - curZoom) * (1 - Math.exp(-dt * 6));

      // Ease lights
      const lightLerp = 1 - Math.exp(-dt * 4);
      scene.environmentIntensity += (targetEnvIntensity - scene.environmentIntensity) * lightLerp;
      keyLight.intensity += (targetKeyIntensity - keyLight.intensity) * lightLerp;
      keyLight.color.lerp(targetKeyColor, lightLerp);
      rimLight.intensity += (targetRimIntensity - rimLight.intensity) * lightLerp;
      renderer.toneMappingExposure += (targetExposure - renderer.toneMappingExposure) * lightLerp;

      // Camera position & view offset
      const fovRad = THREE.MathUtils.degToRad(26 * 0.5);
      const camZ = heroH / (2 * Math.tan(fovRad) * curPx * curZoom);
      camera.position.z = camZ;
      camera.setViewOffset(heroW, heroH, heroW * 0.5 - curCx, heroH * 0.5 - curCy, heroW, heroH);

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
